ซีเรียสเรื่องสี ไม่เกิน 5,000 ใบพิมพ์ -> jet press ถ้ามี UV ต้องเป็น tapest
- สินค้าพวกสีเครื่องสำอางค์ , งานสีอ่อนๆ , งานไล่สี (ถ้าไม่มีข้อมูลมักจะให้ไป jet press)
jet press ไม่ควรเกิน 5,000 ใบพิมพ์ (เครื่องร้อน heat)
สีพิเศษ ส่วนใหญ่จะลง Offset 
สีพิเศษ + น้อยหลัก 100 ใบพิมพ์ ลง jet press แต่สีพิเศษอาจจะไม่ตรงเท่าไหร่
make ready offset 300-400 บพ.
5,000 offset ต้นทุนจะถูกกว่า ( jet press ลงกระดาษได้ไม่กี่ size )
ลองวางเลย์ด้วยกระดาษ jet press อาจจะเสียเศษเยอะกว่า Offset ที่มีไซส์เหมาะสม
ถ้า < 1,000 ใบพิมพ์ ขอลง jet press
cut 1,2,3 --> สี , ยอดงาน , 
> 6 col== gl844 ควรจะมากกว่า 1,000 ใบพิมพ์ , ถ้าน้อยกว่า 1,000 ใบพิมพ์ ให้เปลี่ยนกระดาษเป็นไซส์เล็กลงเพื่อให้ได้ใบพิมพ์มากขึ้น
** 4 cols > 5000 ใบพิมพ์ ให้ลง cut 2ก่อน (เพราะมี 2 เครื่อง)
ถ้าไม่ใช่ประกบลูกฟูก ห้ามเกิน size เครื่องไดนัท (เครื่องปะใหญ่กว่า gl844 , เครื่องไดคัทใหญ่กว่า)  max: 29.5*41.75"
ปะลูกฟูกใหญ่ได้เท่า gl844
งานปะ/ไม่ปะ ลง gl844 ถ้ามีเคลือบ UV กระดาษต้องไม่เกิน 30.9*43.3" (ไซส์เครื่อง UV ที่เรามี)
credit < 30 d. [A] --> markdown 30%
credit > 30 d. --> markdown 10% afterpress , 60 d (ไม่ลด) , ถ้าต่อถึงจะลดให้
