<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>3D dieline test harness</title>
	<style>
		html, body { margin: 0; background: #dbe2f5; }
		#c { width: 900px; height: 660px; display: block; }
	</style>
	<script src="/js/library/jquery-3.5.1.min.js"></script>
	<script src="/js/library/three.min.js"></script>
	<script src="/js/function_dieline_3d.js"></script>
</head>
<body>
	<canvas id="c"></canvas>
	<script>
		// Test-only harness: เรียก core ของ function_dieline_3d.js โดยตรง
		// usage: /estimate_3dtest.html?type=1&W=225&L=103&D=160&fold=1
		window.addEventListener('load', function () {
			var q = new URLSearchParams(location.search)
			function n(k, dflt) { var v = parseFloat(q.get(k)); return isNaN(v) ? dflt : v }
			function go() {
				if (!window.__dieline3d || typeof THREE === 'undefined') return setTimeout(go, 50)
				var d = {
					type: n('type', 1), W: n('W', 225), L: n('L', 103), D: n('D', 160),
					T: n('T', 15), G: n('G', 10), dust: n('dust', 8), OL: n('OL', 5)
				}
				var spec = window.__dieline3d.buildSpec(d)
				var built = window.__dieline3d.buildBoxGroup(spec)
				var v = new window.__dieline3d.Viewer(document.getElementById('c'))
				v.az = n('az', 0.9); v.pol = n('pol', 1.05)
				v.setScene(built.group, built.folds)
				v.resize()
				v.setFold(n('fold', 1))
				v.start()
				window.__ready = true
			}
			go()
		})
	</script>
</body>
</html>
