เริ่มจาก Kraftwrap 

ได้ข้อมูลจากการกดปุ่ม "คำนวณ Layout"
1. est.setDefaultPacking(index) (ฟังก์ชั่นนี้จะ set default kraftwrap มาให้อย่างเดียว)
@packing_size = setCalculatePackingSize(item) คำนวณตามสูตรจะได้ [กว้าง, ยาว, กว้าง_mm, ยาว_mm]
@num_side = กำหนดจำนวนแต่ละด้านเริ่มต้นที่ [1 กว้าง,1 ยาว]
@w_side = ขนาดด้านกว้าง จำนวนด้านกว้าง * packing_size[กว้าง]
@l_side = ขนาดด้านกว้าง จำนวนด้านยาว * packing_size[ยาว]
@Kraftwrap_lay_size = [@w_side, @l_side, @w_side_mm, @l_side_mm]
@obj = {
    bulk_size: @packing_size,
    layKraftwrap: @Kraftwrap_lay_size,
    num_side: @num_side,
    qty_per_kraftwrap: ""
}
>> setKraftwrap(index,obj) >> ถ้า obj ไม่มีค่าอะไรเลย คือไม่มีการ packing รูปแบบนี้
--- START ฟังก์ชั่น setKraftwrap ---
@default_kraftwrap_price = 5 (น่าจะเป็น THB)
@Kraftwrap = {
    unit_price : @default_kraftwrap_price,
    num_side : num_side,
    cube_size : @kraftwrap_lay_size,
    bulk_size : @packing_size,
    num_bulk_per_layer : num_side[กว้าง] * num_side[ยาว],
    qty_per_kraftwrap : ""
}
--- END ฟังก์ชั่น setKraftwrap ---

2. setCalculateUps(index) คำนวณการใช้กระดาษ น้ำหนัก ราคาแพคกิ้ง
    setCalculatePaperWeight(index)
    setCalculateCorrugatedBoard(index)
    setCalculateComponentWeight(index)

    //* Delivery & Packing *//
    * คำนวณ item weight , thickness
    2.1 this.setCalculateComponentWeight(index)
        @ area_box = setCalculateArea(item) คำนวนตามสูตรแต่ละ Comp. / 12 = open_size[2] * [3]
            * เฉพาะ 2,3
        @ corrugated_weight = ทศนิยม 3 หลัก (area_box * corru.info.all_gram * corru.info.num_layer / 1 ล้าน) || 0
            * เฉพาะ 1,2
        @ paper_weight = ทศนิยม 3 หลัก (area_box * item.gram / 1 ล้าน) || 0
        @@ item.weight = {
            paper_weight,
            corrugated_weight,
            weight(น้ำหนักรวม): ทศ3หลัก (paper_weight + corrugated_weight) // ref.A2
        }

        this.setCalculateThickness(item)
                * เฉพาะ 2,3
            @ corrugated_thickness = corru.info.thickness
                * เฉพาะ 1
            @ paper_thickness = paper.paper_thickness
            @ total_hickness_mm = paper_thickness + corrugated_thickness
            @ packing_thickness_mm = total_hickness_mm * packing_layer

            @@ item.thickness = {
                mm:{
                    paper_thickness,
                    corrugated_thickness,
                    thickness: ทศ2 (total_hickness_mm),
                    packing_thickness: ทศ2 (packing_thickness_mm)
                },
                inch:{
                    paper_thickness: ทศ5 ( (ปัดเป็นจำนวนเต็ม + ถัดไป (paper_thickness / 25.4 * 100000)) / 100000)
                    corrugated_thickness: ทศ5 ( (ปัดเป็นจำนวนเต็ม + ถัดไป (corrugated_thickness / 25.4 * 100000)) / 100000)
                    thickness: ทศ5 ( (ปัดเป็นจำนวนเต็ม + ถัดไป (total_hickness_mm / 25.4 * 100000)) / 100000)
                    packing_thickness: ทศ5 ( (ปัดเป็นจำนวนเต็ม + ถัดไป (packing_thickness_mm / 25.4 * 100000)) / 100000)
                },
            }

    2.2 setCalculateKraftwrapCost2(item,index)
@default_kraftwrap_thickness = 0.5 mm
@bulk_height = [ packing_thickness_inch , packing_thickness_mm]
@num_per_layer = @num_bulk_per_layer
@weight_per_layer = weight * @num_bulk_per_layer
@layer_per_pack = 1
@qty_per_pack = 0

คำนวณ layer_per_pack
layer_per_pack = 
    if qty_per_kraftwrap = "" // ครั้งแรก / ระบบคำนวณให้
        if (default_limit_kraftwrap_weight / weight_per_layer) = 0
            loop {
                total_weight = weight_per_layer * layer_per_pack
                total_height = layer_per_pack * height[0]
                layer_per_pack ++

                if total_weight <= default_limit_kraftwrap_weight 
                    และ total_height <= default_a3_size[1]
                    >> วนซ้ำ
                else
                    >> ออกจาก loop
            }
            
            if
                total_weight <= default_limit_kraftwrap_weight
                หรือ 
                total_height <= default_a3_size[1]
                    layer_per_pack -= 1
            
            full_pack = ceil(layer_per_pack / 10) * 10

            if full_pack !== layer_per_pack
                @ diff_layer = full_pack - layer_per_pack
                @@ layer_per_pack = diff_layer <= 5 ? full_pack - 5 : full_pack - 10
            
            if layer_per_pack <= 0
                @@ layer_per_pack = 1
        
    else
        @@ layer_per_pack = ceil( weight_per_qty * qty_per_kraftwrap / weight_per_layer)
----- จบ คำนวณ layer_per_pack ----

if qty_per_kraftwrap = ""
    @@ qty_per_pack = layer_per_pack * num_per_layer
    @@ net_weight = ทศ2( weight_per_layer * layer_per_pack)
else
    @@ qty_per_pack = qty_per_kraftwrap
    @@ net_weight = ทศ2(weight * qty_per_pack)

@@ gross_weight = net_weight
@@ inner_size = [
    kw.info.cube_size[0],
    kw.info.cube_size[1],
    ทศ2(bulk_height[0] * layer_per_pack),
    kw.info.cube_size[2],
    kw.info.cube_size[3],
    bulk_height[1] * layer_per_pack
]
@ doubleThickness =  default_kraftwrap_thickness * 2
@@ outer_size = [
    ทศ2(kw.info.cube_size[0] + mm2inch(doubleThickness)),
    ทศ2(kw.info.cube_size[1] + mm2inch(doubleThickness)),
    ทศ2(bulk_height[0] * layer_per_pack + mm2inch(doubleThickness)),
    ทศ2(kw.info.cube_size[2] + doubleThickness),
    ทศ2(kw.info.cube_size[3] + doubleThickness),
    ทศ2(bulk_height[1] * layer_per_pack + doubleThickness),
]
---- จบ คำนวณ kraftwrap ----

    setCalculateCartonCost(item,false,index)
    setCalculatePaperbandCost(item,index)
    setCalculatePalletCost(item,index)
    setCalculateDelivery(item)