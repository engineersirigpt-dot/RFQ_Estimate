- แก้ไขการเก็บข้อมูลให้เหมาะสมกับลำดับการทำงาน
- แก้ไขการ Handle Events เมื่อมีการเปลี่ยนแปลงสิ่งใดๆ
- เพิ่มฟังก์ชั่นสำหรับตรวจสอบการเปลี่ยนแปลงข้อมูล

คำนวณใหม่ทั้งหมดทุก Component.
disp.displayCalcLayoutSection(true)

คำนวณกระดาษทุก Component ย่อย - เมื่อมีการแก้ไข qty.
setChangeComponentQty(unique_id)
    const { unique_id } = getTargetElementInfo(this, '.sub_component')
    // * show recalc. some layout.
    setChangeSubComponentInfo(unique_id)

คำนวณ Packing ใหม่
disp.displayCalcPackingSection(true)

    คำนวณใหม่แบบใช้ค่าเดิม
    const custom = PK.getCustomPacking(unique_id)
    PK.reCalcPacking(unique_id, doc.job_data, index, custom)

